syntax = "proto3";

package native;

import "google/protobuf/any.proto";
import "native/enum.proto";

option go_package = "github.com/jenken827/pfm-proto/proto/gen/native";

// BaseResp 应用响应
message BaseResp {
  optional RespCode code = 1;
  optional string message = 2;
  optional google.protobuf.Any data = 3;
}
