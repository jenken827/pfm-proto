name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 格式检查
        run: test -z "$(gofmt -l . | grep -v '^proto/gen/')"
      - name: 校验 sgorm 选项副本
        run: ./dev.sh verify-sgorm
      - name: go vet
        run: go vet ./...
      - name: 构建
        run: go build ./...
      - name: 测试
        run: go test ./...

  # 生成物入库是为了让消费方不必装 buf / protoc；代价是必须防止它与 .proto 漂移。
  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"

      - name: 安装生成器
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install github.com/jenken827/protoc-gen-sgorm/cmd/protoc-gen-sgorm@v0.1.0
          dart pub global activate protoc_plugin 25.1.0

      - name: 重新生成
        run: |
          export PATH="$PATH:$HOME/go/bin:$HOME/.pub-cache/bin"
          ( cd proto && buf generate )
          ( cd proto && buf generate --template buf.gen.dart.yaml )
          ( cd proto && buf generate --template buf.entity.gen.yaml )

      - name: 校验生成物与 proto 同步
        run: |
          git diff --exit-code -- proto/gen dart/lib || {
            echo "::error::proto/gen（含 GORM 实体）或 dart/lib 与 .proto 不一致，请本地跑 ./dev.sh proto 并提交" >&2
            exit 1
          }
