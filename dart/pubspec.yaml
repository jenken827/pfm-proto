name: pfm_proto
description: pfm app-side protobuf definitions, generated by pfm-proto.
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.13.0

# Keep in step with the protoc_plugin used for generation: 25.1.0 emits the
# protobuf 6.x $_createMessage API, which older runtimes cannot compile.
# NOTE: this file must stay pure ASCII -- pub on non-English Windows decodes the
# pubspec of a git dependency with the system ANSI code page and mangles UTF-8.
dependencies:
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
